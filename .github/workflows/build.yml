name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Build iOS and upload to TestFlight"
        type: boolean
        default: true
      android:
        description: "Build Android APK/AAB"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck worker
        working-directory: backend/worker
        run: npm ci && npm run typecheck

  android:
    name: Android
    needs: check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android }}
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Prebuild
        run: npx expo prebuild --platform android --no-install
      - name: Decode upload keystore
        if: ${{ env.HAS_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
          cat >> android/gradle.properties <<EOF
          FIELDLENS_UPLOAD_STORE_FILE=upload.keystore
          FIELDLENS_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIELDLENS_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          FIELDLENS_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          python3 scripts/android-release-signing.py
      - name: Build release
        working-directory: android
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fieldlens-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS → TestFlight
    needs: check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ios }}
    runs-on: macos-26
    env:
      KEYCHAIN: build.keychain-db
      HAS_IOS: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until iOS signing secrets exist
        if: ${{ env.HAS_IOS == '' }}
        run: echo "iOS signing secrets not set — skipping iOS build. See README." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: ${{ env.HAS_IOS != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ env.HAS_IOS != '' }}
      - name: Select Xcode
        if: ${{ env.HAS_IOS != '' }}
        run: sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Prebuild
        if: ${{ env.HAS_IOS != '' }}
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        if: ${{ env.HAS_IOS != '' }}
        working-directory: ios
        run: pod install --repo-update
      - name: Import signing certificate
        if: ${{ env.HAS_IOS != '' }}
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$CERT_B64" | base64 -d > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm cert.p12
      - name: Install provisioning profile
        if: ${{ env.HAS_IOS != '' }}
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -f ios-signing/FieldlensAppStore.mobileprovision ]; then
            cp ios-signing/FieldlensAppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          else
            echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/FieldlensAppStore.mobileprovision
          fi
      - name: Archive
        if: ${{ env.HAS_IOS != '' }}
        working-directory: ios
        run: |
          xcodebuild -workspace Fieldlens.xcworkspace -scheme Fieldlens -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Fieldlens.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER=FieldlensAppStore \
            archive | xcpretty || exit ${PIPESTATUS[0]}
      - name: Export IPA
        if: ${{ env.HAS_IOS != '' }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key><dict>
              <key>eu.fieldlens.app</key><string>FieldlensAppStore</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fieldlens.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        if: ${{ env.HAS_IOS != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_IOS != '' }}
        with:
          name: fieldlens-ios
          path: ${{ runner.temp }}/export/*.ipa
      - name: Clean keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
