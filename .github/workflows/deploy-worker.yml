name: Deploy API

on:
  push:
    branches: [main]
    paths: ["backend/worker/**", "shared/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Skip deploy until Cloudflare secrets exist
        if: ${{ env.HAS_CF == '' }}
        run: echo "CLOUDFLARE_API_TOKEN not set — typecheck only." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Cloudflare
        if: ${{ env.HAS_CF != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Push secrets
        if: ${{ env.HAS_CF != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY
          if [ -n "${{ secrets.FIELDLENS_APP_TOKEN }}" ]; then
            echo "${{ secrets.FIELDLENS_APP_TOKEN }}" | npx wrangler secret put APP_TOKEN
          fi
